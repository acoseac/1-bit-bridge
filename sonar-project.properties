sonar.projectKey=acoseac_1-bit-bridge
sonar.organization=acoseac

# Source / test partitioning. SonarCloud's auto-detection for Go projects
# already classifies *_test.go as tests, but pinning it explicitly keeps
# the partition stable across analyzer versions.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/vendor/**,**/dist/**,**/admin/static/**

# Copy-paste detection excludes test files by convention. Test
# arrange-act-assert blocks are intentionally repetitive for readability
# (each test should make sense in isolation without chasing helper
# indirection); applying production-code duplication thresholds to that
# style flags every parallel test as a finding. The trade-off is
# explicitly accepted by major Go/Java/JS Sonar deploys — see
# https://docs.sonarsource.com/sonarqube-server/latest/project-administration/analysis-scope/
# §"Ignore Issues, Code Coverage, or Duplications".
#
# Production-code duplication is still detected (e.g. our two earlier
# round-2 prefix-check helpers would have been flagged across packages).
# Per PR #356 round-4: prod file_handler.go / proxy.go / dlna_wiring.go
# all measured 0 duplicated lines; ALL 70 flagged lines lived in
# *_test.go fan-outs created during the cognitive-complexity refactor.
sonar.cpd.exclusions=**/*_test.go
