# Synthetic: pipewire-alsa's library path must not spoil other PCMs.
pcm_type.pipewire { libs.native = /usr/lib/alsa-lib/libasound_module_pcm_pipewire.so ; }
pcm.keep { type empty slave.pcm direct }
pcm.direct { type hw card "Audio" device 1 }
pcm.effect { type softvol slave.pcm direct }
pcm.listen { type empty slave.pcm effect }
