# Synthetic: failed numeric conversions are strings in alsa-lib.
pcm.keep { type empty slave.pcm direct }
pcm.direct { type hw card "Audio" device 1 }
pcm.effect {
    type softvol
    slave.pcm direct
    control { name 2chMaster card 2 }
    values [ 0.5garbage -5dB --5 1e 1_000 0x - 1e9999 1e-9999 .5 ]
}
pcm.listen { type empty slave.pcm effect }
