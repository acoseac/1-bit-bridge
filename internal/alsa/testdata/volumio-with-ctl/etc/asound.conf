ctl.!default {
    type hw;
    card "Audio";
}
ctl.name {
    type hw
    card 0
}
defaults.pcm.card 2,
defaults.pcm.device 0

pcm.!default {
    type             empty
    slave.pcm       "volumio"
}

pcm.volumio {
    type             empty
    slave.pcm       "volumioOutput"
}


# There is always a plug before the hardware to be safe
pcm.volumioOutput {
    type plug
    slave.pcm "volumioHw"
}

pcm.volumioHw {
    type hw
    card "Audio"
}
