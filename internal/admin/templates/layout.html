{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.LibraryName}} — 1-bit Bridge</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="/static/favicon-64.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png?v=2">
<link rel="apple-touch-icon" href="/static/favicon-192.png?v=2">
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-active="{{.ActiveTab}}">
<header>
  <div class="brand">
    <img class="brand-mark" src="/static/bridge-mark.png?v=2" alt="" width="40" height="40">
    <span class="name">{{.LibraryName}}</span>
  </div>
  <button id="nav-toggle" class="nav-toggle" type="button"
          aria-controls="primary-nav" aria-expanded="false" aria-label="Menu">☰</button>
  <nav id="primary-nav">
    <a href="/" data-tab="dashboard">Dashboard</a>
    <a href="/library" data-tab="library">Library</a>
    <a href="/library/inspector" data-tab="library_inspector">Inspector</a>
    <a href="/jobs" data-tab="jobs">Jobs</a>
    <a href="/devices" data-tab="devices">Devices</a>
    <a href="/settings" data-tab="settings">Settings</a>
  </nav>
  <div class="meta">
    bridge {{.ServerVersion}} · protocol v{{.ProtocolVersion}}
    <span id="conn-status" class="conn-badge" data-state="connecting" aria-live="polite">Connecting…</span>
    <a href="/devices" id="pairing-badge" class="pairing-badge" hidden
       aria-label="Pending pairing requests">
      <span class="pairing-badge-dot" aria-hidden="true"></span>
      <span class="pairing-badge-count" data-count="0"
            role="status" aria-live="polite" aria-atomic="true">0</span>
      <span class="pairing-badge-label">pending</span>
    </a>
  </div>
</header>
<main>
{{template "content" .}}
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
{{end}}
