{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.LibraryName}} — 1-bit Bridge</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=1">
<link rel="icon" type="image/png" sizes="64x64" href="/static/favicon-64.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png?v=1">
<link rel="apple-touch-icon" href="/static/favicon-192.png?v=1">
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-active="{{.ActiveTab}}">
<header>
  <div class="brand">
    <img class="brand-mark" src="/static/bridge-mark.png?v=1" alt="" width="40" height="40">
    <span class="name">{{.LibraryName}}</span>
  </div>
  <nav>
    <a href="/" data-tab="dashboard">Dashboard</a>
    <a href="/library" data-tab="library">Library</a>
    <a href="/devices" data-tab="devices">Devices</a>
    <a href="/settings" data-tab="settings">Settings</a>
  </nav>
  <div class="meta">
    bridge {{.ServerVersion}} · protocol v{{.ProtocolVersion}}
  </div>
</header>
<main>
{{template "content" .}}
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
{{end}}
