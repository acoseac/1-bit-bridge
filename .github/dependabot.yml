version: 2
updates:
  # GitHub Actions — keeps the commit-pinned workflow refs current.
  # With commit-SHA pinning, the version comments after each `@sha` are
  # what Dependabot reads to decide when a bump is available. PRs land
  # weekly; review + merge updates when they look sensible.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
      include: scope

  # Go modules — keeps the bridge's dependencies current. Conservative
  # schedule so we don't drown in minor version PRs; breaking updates
  # still surface promptly.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: deps
      include: scope
