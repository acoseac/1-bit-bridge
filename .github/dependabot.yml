# Dependabot update policy. The github-actions ecosystem is what consumes
# the `# vX.Y.Z` version comments next to each commit-pinned action in
# .github/workflows/*.yml — it proposes bumps as PRs against the pinned SHA.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # The three github/codeql-action/{init,autobuild,analyze} steps in
    # codeql.yml must bump together: init stamps its version into a
    # config the others refuse when the versions differ. Without a
    # group, Dependabot opens one PR per step and each fails alone
    # (4.38.3 batch: #1264, #1265, #1268). patterns matches the action
    # name with or without a subpath; update-types is left unset so the
    # group covers major, minor and patch (Dependabot's default).
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
