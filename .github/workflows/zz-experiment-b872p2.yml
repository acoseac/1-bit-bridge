# EXPERIMENT (not for merge; B872 part 2). Runs only on a push to its own
# branch. Second run: the real-binary hold experiment UNDER LOAD, beside a
# whole ./cmd/bridge package run, as CI's Windows job runs it, with CI's
# Defender exclusion of Go's temp tree.
name: experiment-b872p2

on:
  push:
    branches: ["experiment/b872p2-realexe"]

permissions:
  contents: read

jobs:
  underload:
    name: realexe under load (${{ matrix.try }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        try: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Exclude the Go temp tree from Defender (as gate.yml does)
        shell: bash
        run: |
          GOTMP=$(go run ./.github/scripts/printtmpdir 2>/dev/null || echo "$TEMP")
          echo "Go os.TempDir() = $GOTMP"
          pwsh -Command "Add-MpPreference -ExclusionPath '$GOTMP'" || true
      - name: realexe beside the cmd/bridge package
        shell: bash
        run: |
          set +e
          go test -tags ts_omit_webclient,ts_omit_debugeventbus -timeout 60m ./cmd/bridge > load.log 2>&1 &
          LOAD=$!
          sleep 90
          go test -tags ts_omit_webclient,ts_omit_debugeventbus -run '^TestExperimentRealExeHold$' -count 1 -v -timeout 60m ./internal/updater > realexe.log 2>&1
          echo "realexe exit $?"
          wait $LOAD
          echo "load exit $?"
          grep -E 'SUMMARY|built the bridge' realexe.log
          grep -E 'rename bak->dst: [^<]' realexe.log | head -20
          grep -cE 'probe after: [^<]' realexe.log
          grep -E '^(ok|FAIL)|^--- FAIL' load.log | head -20
          grep -nE 'being used by another process|Access is denied' load.log | head -20
          exit 0
