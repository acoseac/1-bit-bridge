name: Greptile Code Review (Large PRs only)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-size-and-review:
    runs-on: ubuntu-latest
    steps:
      - name: Get number of changed files
        id: pr-size
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FILES=$(curl -s \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            | jq '. | length')
          echo "changed_files=$FILES" >> $GITHUB_OUTPUT
          echo "PR has $FILES changed files"

      - name: Skip small PRs
        if: ${{ fromJSON(steps.pr-size.outputs.changed_files) < 5 }}
        run: |
          echo "PR has fewer than 5 changed files — skipping Greptile review to save credits."

      - name: Trigger Greptile Review
        if: ${{ fromJSON(steps.pr-size.outputs.changed_files) >= 5 }}
        env:
          GREPTILE_API_KEY: ${{ secrets.GREPTILE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CHANGED_FILES: ${{ steps.pr-size.outputs.changed_files }}
        run: |
          echo "PR has ${CHANGED_FILES} changed files — triggering Greptile review."
          curl -s -X POST "https://api.greptile.com/v2/review" \
            -H "Authorization: Bearer ${GREPTILE_API_KEY}" \
            -H "X-Github-Token: ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg url "$PR_URL" '{prUrl: $url}')"
