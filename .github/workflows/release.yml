name: release

on:
  push:
    tags:
      - "v*"

permissions:
  # goreleaser needs contents:write to upload archives to the Release.
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # Commit-pinned so a hijacked / retagged upstream can't tamper
      # with a release build that signs artifacts with our cert. Version
      # comments feed Dependabot — see .github/dependabot.yml.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # goreleaser reads the full git log for changelog

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # rcodesign is the pure-Rust Apple-codesign tool GoReleaser's
      # notarize feature shells out to. Installing it on the Linux runner
      # means the whole signing + notarization pipeline can run without a
      # macOS runner (macOS-latest minutes cost ~10x Ubuntu). Pinned to a
      # known-good release; bump deliberately after reviewing changelog,
      # and recompute SHA256 from the new release asset when bumping.
      - name: Install rcodesign
        run: |
          set -eu
          VER=0.29.0
          # SHA-256 of the pinned tarball, computed from the release asset
          # on 2026-07-21. Verified after download so a tampered/retagged
          # upstream artifact fails the job instead of reaching the
          # code-signing pipeline. (shasum ships with the runner's perl.)
          SHA256=dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
          URL="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${VER}/apple-codesign-${VER}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSL -o /tmp/rcodesign.tar.gz "$URL"
          echo "${SHA256}  /tmp/rcodesign.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/rcodesign.tar.gz -C /tmp
          sudo mv /tmp/apple-codesign-*/rcodesign /usr/local/bin/
          rcodesign --version

      - uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization. All four are set from repo
          # secrets — if any are missing, the notarize block's
          # `enabled: isEnvSet` gate short-circuits and the release
          # proceeds unsigned (PR forks, first-time setup, etc). The
          # .p12 and .p8 are base64-encoded before being stored so the
          # secret round-trip preserves their binary contents.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          # APPLE_TEAM_ID is required by the .goreleaser.yaml hard-fail
          # hook (PR #42) when MACOS_SIGN_P12 is set, AND is injected
          # at link-time into appleTeamIDOverride so the macOS updater
          # verifier can reject swap candidates signed by a different
          # Team ID. Wiring was missed in PR #26's initial signing
          # bring-up — v0.1.0 silently shipped unsigned macOS binaries
          # because the hook didn't exist yet; v0.1.1 trips the hook.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
