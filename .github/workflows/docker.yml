name: docker

# Builds + publishes the multi-arch container image to the GitHub
# Container Registry (GHCR): ghcr.io/acoseac/1-bit-bridge.
#
#   - On a tag push (v*), publishes the image for that release alongside
#     the goreleaser archives produced by release.yml.
#   - Via workflow_dispatch, publishes a specific tag — used to publish
#     an image for a release that predates this workflow (e.g. v0.1.7).
#
# Auth uses the workflow's built-in GITHUB_TOKEN (packages: write) — no
# PAT or repo secret to manage.
#
# ONE-TIME: the first push creates the package as PRIVATE. Flip it to
# Public once at
#   https://github.com/users/acoseac/packages/container/1-bit-bridge/settings
# after which anonymous `docker pull` works and it stays public.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish as the image tag, e.g. v0.1.7"
        required: true
        type: string
      ref:
        description: "Git ref to build from (branch / tag / SHA). Defaults to the version tag; set to a branch (e.g. main) to build current packaging for a frozen release tag whose own Dockerfile predates it."
        required: false
        type: string
      moving_tags:
        description: "Also publish :<MINOR> and :latest. Leave OFF to smoke-test the workflow without repointing the tags a bare `docker pull` resolves to; turn ON when republishing a real release."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

# Serialize every publish. :MINOR and :latest float, so two overlapping
# runs (a tag push racing a dispatch, or two tags pushed together) would
# leave them pointing at whichever finished last rather than at the newer
# version. cancel-in-progress stays FALSE deliberately: cancelling a run
# mid-push can leave a partially-uploaded multi-arch manifest in the
# registry, which is worse than waiting.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/acoseac/1-bit-bridge

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # Commit-pinned so a hijacked / retagged upstream can't tamper with
      # a published image. Version comments feed Dependabot — see
      # .github/dependabot.yml. SHAs match release.yml where shared.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - name: Resolve version + image tags
        id: meta
        env:
          # A tag push IS a release, so it always moves the floating tags.
          # A dispatch carries an operator-supplied string that may not be
          # a release at all, so it must opt in.
          MOVE_FLOATING: ${{ github.event_name == 'push' || inputs.moving_tags }}
          # Passed as an env var, NOT interpolated into the script below.
          # Actions expands ${{ }} textually BEFORE bash sees the line, so a
          # tag or dispatch input containing shell syntax would execute here
          # — in a job holding `packages: write` and a registry login.
          # Through env it arrives as inert data.
          RAW_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          RAW="$RAW_REF"
          # Validate before the value reaches an image tag or GITHUB_OUTPUT.
          # Docker's tag grammar is [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}; a
          # newline additionally lets the value forge extra GITHUB_OUTPUT
          # keys, so it must be rejected too.
          #
          # `case` globs match the WHOLE string, which is why the charset
          # test is one here rather than a grep -E: grep anchors ^…$ per
          # LINE, so a multi-line value whose first line looks valid passes
          # it. (Confirmed against a literal "v1.0.0\nversion=pwned".)
          case "$RAW" in
            v[0-9]*|[0-9]*) ;;
            *) echo "::error::refusing tag '$RAW' — expected a version like v1.2.3" >&2; exit 1 ;;
          esac
          case "$RAW" in
            *[!A-Za-z0-9._-]*)
              echo "::error::refusing tag '$RAW' — not a valid docker tag" >&2; exit 1 ;;
          esac
          if [ "${#RAW}" -gt 128 ]; then
            echo "::error::refusing tag '$RAW' — exceeds the 128-char docker tag limit" >&2
            exit 1
          fi
          VER="${RAW#v}"            # strip a leading v  ->  0.1.7
          MINOR="${VER%.*}"         # 0.1.7  ->  0.1
          # :VER is immutable and always published. :MINOR and :latest
          # FLOAT — they repoint at whatever built last — so a dispatch
          # only moves them when the operator asks.
          #
          # Every path used to publish all three unconditionally, which
          # made the workflow impossible to exercise safely: dispatching a
          # throwaway tag to smoke-test it (say v0.1.7-test) silently
          # repointed :0.1 and :latest on a PUBLIC package at that build,
          # and :latest is what a bare `docker pull` resolves to. The
          # republish-a-frozen-tag recovery in CLAUDE.md (tag=<ver> +
          # ref=main) genuinely does want them moved — hence an opt-in
          # rather than a blanket event gate.
          if [ "$MOVE_FLOATING" = "true" ]; then
            TAGS="${IMAGE}:${VER},${IMAGE}:${MINOR},${IMAGE}:latest"
          else
            TAGS="${IMAGE}:${VER}"
          fi
          {
            echo "version=$VER"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Building $RAW (moving tags: $MOVE_FLOATING) -> $TAGS"

      # QEMU is still needed for the small per-arch runtime stage (apk add
      # + adduser); the Go build itself cross-compiles natively on the
      # amd64 runner (see Dockerfile BUILDPLATFORM/TARGETARCH), so the slow
      # emulated-compile path is avoided.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Keep the manifest a clean 2-arch index — provenance/SBOM
          # attestations add "unknown/unknown" entries that clutter the
          # GHCR UI. Can be revisited (mode=max) if supply-chain
          # attestations are wanted later.
          provenance: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/acoseac/1-bit-bridge
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=FSL-1.1-MIT
            org.opencontainers.image.description=Cross-platform Go companion server for the 1-bit iOS music player
