name: gate

# Runs the build/test half of the pre-push gate on CI so green no longer
# depends on a contributor's local machine (which, on a RAM-constrained
# box, OOMs under the `-race` + 6-target cross-compile peak). The
# formatting half is covered by gofmt.yml; together they reproduce the
# local gate documented in CONTRIBUTING.md / CLAUDE.md:
#   make fmt vet test build-all
# (gofmt.yml = the `fmt` check; this workflow = vet + test + build-all).
#
# Action references are commit-pinned (not tag-pinned) so a hijacked
# upstream can't silently alter what runs here — matches gofmt.yml and
# codeql.yml. Version comments are what Dependabot reads to bump the SHAs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a fresh push lands on the same ref — only
# the latest commit's gate result matters; redundant runs burn minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: vet · test -race · build-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # No step pushes to the repo; drop the ambient GITHUB_TOKEN.
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      # The runner has ample RAM, so the Makefile's conservative default
      # P (parallelism cap, for memory-constrained laptops) would only
      # slow CI down — let it use all the runner's cores.
      - name: vet
        run: make vet

      - name: test (race)
        run: make test P=$(nproc)

      - name: build-all (cross-compile)
        run: make build-all P=$(nproc)
