name: gofmt

# Fails the PR if any Go source file isn't `gofmt`-clean.
#
# Why this exists: the Makefile target `make fmt` runs `go fmt ./...`
# which REWRITES files in place — it's "fix", not "check". Without a
# read-only gate, drift sneaks in: a contributor (or an AI assistant)
# commits unaligned struct fields, no bot review catches it, the
# operator's next `make fmt vet test build-all` silently re-formats
# the file and produces a confusing dirty working tree. PR #284's
# `internal/integrity/sidecars_test.go` drift is the canonical case
# this gate prevents.
#
# Action references are commit-pinned (not tag-pinned) so a hijacked
# upstream can't silently alter what runs here — matches the project
# convention from `.github/workflows/codeql.yml`. Version comments are
# what Dependabot reads to keep the SHAs current.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight gofmt runs when a fresh push lands on the same ref —
# only the latest commit's formatting state matters, redundant runs
# burn Actions minutes without surfacing new information.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gofmt:
    name: gofmt -l
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # No subsequent step pushes anything to the repo, so the
          # default-persisted GITHUB_TOKEN in the workspace would be
          # ambient credential exposure. Drop it.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # `gofmt -l` prints filenames of mis-formatted files (and only
      # those). Fail the job when its output is non-empty so a PR with
      # drift can't merge silently. `gofmt -d` runs on the same set to
      # surface the actual diffs in the job log — gives the contributor
      # a concrete patch to apply locally via `make fmt`.
      - name: Check formatting
        run: |
          mis=$(gofmt -l .)
          if [ -n "$mis" ]; then
            echo "::error::The following files are not gofmt-clean:"
            echo "$mis"
            echo ""
            echo "Run 'make fmt' locally and commit the result. Diff:"
            echo "$mis" | xargs gofmt -d
            exit 1
          fi
          echo "All Go files are gofmt-clean."
