name: codeql

# Security-focused static analysis. Runs on push to main, every PR
# against main, and a weekly cron so new rules catch old code. Findings
# land in the repo's Security → Code scanning tab.
#
# Free on public repos; no config beyond language selection needed for
# pure Go. Autobuild handles `go build ./...` internally.
#
# Action references are commit-pinned (not tag-pinned) so a hijacked /
# retagged upstream can't silently alter what runs here. Version
# comments are what Dependabot reads to keep the SHAs current; see
# .github/dependabot.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 7 * * 1" # Mondays 07:27 UTC — off-peak, reduces queue time

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # The three github/codeql-action/* steps below MUST stay pinned to
      # the SAME SHA. `init` writes a config file stamped with its own
      # version and `autobuild` / `analyze` refuse to read one written by
      # a different release:
      #
      #   Loaded a configuration file for version '4.37.3',
      #   but running version '4.37.1'
      #
      # Dependabot treats them as three independent dependencies and
      # opens three separate PRs (#577 / #578 / #580 for this bump), each
      # of which fails on its own branch and would break CodeQL on main
      # if merged alone. Bump all three in ONE commit and close the
      # singles — do not merge a partial set to "make progress".
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          # The `security-extended` suite adds taint-flow + data-flow
          # queries the default suite skips. Trade-off: more findings,
          # some noisier. Given the attack surface here (HTTP API,
          # file-path resolver, SMB-replacement bytes-to-wire code),
          # the extra coverage is worth the occasional false positive.
          queries: security-extended

      - uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
