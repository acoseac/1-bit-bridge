# B653 PR 2a: the merge head's cmd/bridge and internal/backup on Windows against main's, side by side (an experiment, not for main).
name: b653p2a-pair-windows
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        ref: [ "101eead8243f83c68f8a83232cfd4afa36290da6", "30ae88f604afd3efe478bcab26cc61925fb894ca" ]
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Exclude the Go temp tree from Defender
        continue-on-error: true
        run: |
          GOTMP=$(go run ./.github/scripts/printtmpdir 2>/dev/null || echo "$TEMP")
          pwsh -Command "Add-MpPreference -ExclusionPath '$GOTMP'" || echo "could not set exclusion (non-fatal)"
      - name: cmd/bridge and internal/backup, -v, timed
        continue-on-error: true
        run: |
          go version
          for p in ./internal/backup ./cmd/bridge; do
            start=$(date +%s)
            go test -tags ts_omit_webclient,ts_omit_debugeventbus -v -count=1 -timeout 75m $p > "$(basename $p).log" 2>&1
            echo "$p exit=$? seconds=$(($(date +%s)-start))" | tee -a summary.txt
          done
      - name: Summary
        run: |
          cat summary.txt
          for f in backup.log bridge.log; do echo "== $f"; grep -c -- '^--- PASS' $f; grep -c -- '^--- FAIL' $f; grep -- '^--- FAIL' $f | head -20; grep -E -- '^(--- (PASS|FAIL)): .* \([0-9]{2,}\.[0-9]+s\)' $f | sort -t'(' -k2 -rn | head -15; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logs-${{ matrix.ref }}
          path: |
            backup.log
            bridge.log
            summary.txt
